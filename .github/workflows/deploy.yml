# Workflow Name: Deploy to GitHub Pages
# Purpose: Automatically builds the Hugo static site and deploys it to GitHub Pages.
name: Deploy to GitHub Pages

# Trigger conditions
on:
  # Runs automatically on every commit pushed to the main branch
  push:
    branches:
      - main
  # Allows manual execution from the GitHub Actions tab
  workflow_dispatch:

# Permissions required by GitHub Pages and OIDC authentication
permissions:
  contents: read      # Read repository content and themes/submodules
  pages: write         # Deploy content to GitHub Pages
  id-token: write      # Verify deployment authenticity via OIDC tokens

# Concurrency management: ensure only one deployment runs at a time to prevent race conditions
concurrency:
  group: "pages"
  cancel-in-progress: false # Do not cancel in-flight deployments to avoid incomplete states

# Default shell configuration for run commands
defaults:
  run:
    shell: bash

jobs:
  # Job 1: Build the Hugo static site and upload the artifact
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository source files
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # Fetch any Git submodules (e.g., Hugo themes)
          fetch-depth: 0        # Fetch full history (required for Hugo .GitInfo metadata)

      # Step 2: Install Hugo Extended
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest' # Use the latest stable Hugo release
          extended: true         # Enable Hugo Extended (required for SCSS/SASS and asset pipelines)

      # Step 3: Configure GitHub Pages metadata
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true      # Automatically enables GitHub Pages in repository settings if not already enabled

      # Step 4: Build the static files
      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --baseURL "${{ steps.pages.base_url }}/"

      # Step 5: Package and upload the generated public/ directory as a Pages artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Job 2: Deploy the uploaded artifact to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # Wait for the build job to finish successfully
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
