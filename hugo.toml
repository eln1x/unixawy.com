baseURL = "https://www.unixawy.com/"
locale = "en-us"
languageCode = "en-us"
title = "unixawy.com | Security Blog"
theme = "PaperMod"

[pagination]
  pagerSize = 10

enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[taxonomies]
  category = "categories"
  tag = "tags"

[menu]
  [[menu.main]]
  identifier = "posts"
  name = "Articles"
  url = "/posts/"
  weight = 10

  [[menu.main]]
  identifier = "categories"
  name = "Categories"
  url = "/categories/"
  weight = 20

  [[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 30

  [[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 40

  [[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 50

[params]
  env = "production"
  title = "unixawy.com | Security Blog"
  description = "Ahmad Mahfouz - Application Security Manager | Personal blog sharing thoughts, security research, and engineering experiments."
  author = "Ahmad Mahfouz"

  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.profileMode]
    enabled = true
    title = "Hi, I'm Ahmad Mahfouz"
    subtitle = "Application Security Manager — Personal blog sharing thoughts, security research, and engineering experiments."
    imageUrl = "/uploads/2026/02/1763805118345-300x300.png"
    imageTitle = "Ahmad Mahfouz"
    imageWidth = 140
    imageHeight = 140
    buttons = [
      { name = "Read Articles", url = "/posts/" },
      { name = "About Me", url = "/about/" }
    ]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/eln1x"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/ahmadmahfouz"
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/eln1x"

  [params.assets]
    disableHLJS = false

  [params.search]
    enabled = true
