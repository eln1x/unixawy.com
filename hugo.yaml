baseURL: https://www.unixawy.com/
languageCode: en-us
title: unixawy
theme: github.com/adityatelange/hugo-PaperMod
enableRobotsTXT: true

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

params:
  env: production
  title: unixawy
  description: Technical notes and security research by Ahmad Mahfouz.
  author: Ahmad Mahfouz
  defaultTheme: auto
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowReadingTime: true
  ShowPostNavLinks: true
  homeInfoParams:
    Title: Security research, systems, and Linux
    Content: >-
      Technical notes on cybersecurity, vulnerability research, exploit
      development, and Linux. Research is conducted only on systems I own or
      am explicitly authorized to test.

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
