<div class="mermaid-toolbar" role="toolbar" aria-label="Diagram controls">
  <button type="button" data-mermaid-action="zoom-out" aria-label="Zoom out diagram" title="Zoom out">-</button>
  <button type="button" data-mermaid-action="zoom-in" aria-label="Zoom in diagram" title="Zoom in">+</button>
  <output class="mermaid-zoom-level" aria-live="polite" aria-label="Zoom level">100%</output>
  <button type="button" data-mermaid-action="reset" aria-label="Reset diagram zoom">Reset</button>
  <button type="button" data-mermaid-action="fullscreen" aria-label="View diagram full screen">Full screen</button>
  <span class="mermaid-status" role="status" aria-live="polite"></span>
</div>
