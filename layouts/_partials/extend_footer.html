{{- if or (.Store.Get "hasMermaid") (in .Content "class=\"mermaid\"") (.Params.mermaid) (site.Params.mermaid) -}}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  const isDark = document.body.classList.contains("dark");
  mermaid.initialize({
    startOnLoad: true,
    theme: isDark ? 'dark' : 'neutral',
    securityLevel: 'loose'
  });
</script>
{{- end -}}
